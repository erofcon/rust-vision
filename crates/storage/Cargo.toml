[package]
name = "storage"
version = "0.1.0"
edition = "2021"

[dependencies]
queue = { path = "../queue" }
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.44.1", features = ["full"] }
uuid = { version = "1.16.0", features = ["v4"] }
sqlx = { version = "0.8.3", features = [
    "runtime-tokio",
    "postgres",
    "migrate"
] }
