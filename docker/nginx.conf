worker_processes auto;
rtmp_auto_push on;
events {}

# HTTP секция для веб-сервера
http {
    sendfile off;
    tcp_nopush on;
    directio 512;
    default_type application/octet-stream;

    server {
        listen 8888;

        # Разрешаем CORS для веб-плеера
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods GET;

        # Статические файлы (HTML плеер)
        location / {
            root /var/www/html;
            index index.html;
        }

        # HLS сегменты
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp;
            expires -1;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
        }

        # RTMP статистика (опционально)
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root /usr/share/nginx/html;
        }
    }
}

# RTMP секция
rtmp {
    server {
        listen 1935;
        listen [::]:1935 ipv6only=on;

        application live {
            live on;
            record off;

            # Преобразование в HLS с поддержкой множественных потоков
            hls on;
            hls_path /tmp/hls;
            hls_fragment 3s;
            hls_playlist_length 60s;
            # Создаем отдельный плейлист для каждого потока
            hls_nested on;

            # Опционально: преобразование в DASH
            dash on;
            dash_path /tmp/dash;
            dash_nested on;
        }
    }
}