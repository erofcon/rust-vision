["workspace"]
members = ["crates/*", "rust-vision-bin"]
migrate-path = "migrations"

resolver = "2"

["workspace".dependencies]
anyhow = "1.0.98"
actix-web = "4.11.0"
actix-multipart = "0.7.2"
actix-cors = "0.7.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sqlx = "0.8.3"
futures = "0.3.31"
gst = { package = "gstreamer", version = "0.23.5" }
gst-app = { package = "gstreamer-app", version = "0.23.5" }
gst-video = { package = "gstreamer-video", version = "0.23.5" }
gst-pbutils = { package = "gstreamer-pbutils", version = "0.23.5" }
tokio = "1.45.1"
regex = "1.11.1"
opencv = "0.94.4"
image = "0.25"
parking_lot = "0.12.3"
rayon = "1.10.0"
lapin = "2.5.3"
detection = { path = "crates/detection" }
ndarray = { version = "0.16.1", features = ["rayon"] }
uuid = { version = "1.16.0", features = ["v4"] }
ort = { version = "2.0.0-rc.9", features = ["ndarray", "cuda"] }
cairo-rs = { version = "0.20.7" }
once_cell = "1.21.3"
config = "0.15.11"
fast_image_resize = "5.1.4"


project-config = { path = "crates/project-config" }
api = { path = "crates/api" }
common = { path = "crates/common" }
motion = { path = "crates/motion" }
queue = { path = "crates/queue" }
storage = { path = "crates/storage" }
gst-streaming = { path = "crates/gst-streaming" }
face-recognition = { path = "crates/face-recognition" }
vision = { path = "crates/vision" }
inference-core = { path = "crates/inference-core" }

